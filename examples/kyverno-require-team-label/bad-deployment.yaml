apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  labels:
    app: reports
  # No 'team' label, so this Deployment should fail the policy.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reports
  template:
    metadata:
      labels:
        app: reports
    spec:
      containers:
        - name: reports
          image: ghcr.io/example/reports:2.1.0
          ports:
            - containerPort: 8080
