<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="1118.5" height="358.5" rx="16" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="560" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">AI for DevOps: A Practical Roadmap</text>
  <text x="560" y="70" text-anchor="middle" font-size="13.5" fill="#64748b">Start with Assist. Move to Gate as you build trust. Treat Auto as the exception.</text>

  <!-- spine -->
  <line x1="120" y1="175" x2="1000" y2="175" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="175" x2="1000" y2="175" stroke="url(#spine)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- traveling pulse -->
  <g>
    <circle cx="0" cy="0" r="13" fill="#6366f1" opacity="0.2"/>
    <circle cx="0" cy="0" r="6" fill="#6366f1"/>
    <animateTransform attributeName="transform" type="translate" values="120 175; 1000 175; 120 175" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Stage 0 -->
  <g>
    <text x="120" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">DevOps</text>
    <text x="120" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Foundations</text>
    <circle cx="120" cy="175" r="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="120" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">0</text>
    <rect x="88" y="212" width="64" height="21" rx="10.5" fill="#f1f5f9"/>
    <text x="120" y="227" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Prereq</text>
  </g>

  <!-- Stage 1 -->
  <g>
    <text x="267" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">AI</text>
    <text x="267" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Foundations</text>
    <circle cx="267" cy="175" r="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="267" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">1</text>
    <rect x="238" y="212" width="58" height="21" rx="10.5" fill="#f1f5f9"/>
    <text x="267" y="227" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Learn</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <text x="413" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Daily</text>
    <text x="413" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Ops</text>
    <circle cx="413" cy="175" r="20" fill="#ffffff" stroke="#86efac" stroke-width="2.5"/>
    <text x="413" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">2</text>
    <rect x="383" y="212" width="60" height="21" rx="10.5" fill="#dcfce7"/>
    <text x="413" y="227" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">Assist</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <text x="560" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">CI/CD and</text>
    <text x="560" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">GitOps</text>
    <circle cx="560" cy="175" r="20" fill="#ffffff" stroke="#fcd34d" stroke-width="2.5"/>
    <text x="560" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">3</text>
    <rect x="533" y="212" width="54" height="21" rx="10.5" fill="#fef9c3"/>
    <text x="560" y="227" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a16207">Gate</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <text x="707" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Incident</text>
    <text x="707" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Response</text>
    <circle cx="707" cy="175" r="20" fill="#ffffff" stroke="#fcd34d" stroke-width="2.5"/>
    <text x="707" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">4</text>
    <rect x="680" y="212" width="54" height="21" rx="10.5" fill="#fef9c3"/>
    <text x="707" y="227" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a16207">Gate</text>
  </g>

  <!-- Stage 5 -->
  <g>
    <text x="853" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Build</text>
    <text x="853" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Helpers</text>
    <circle cx="853" cy="175" r="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="853" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">5</text>
    <rect x="824" y="212" width="58" height="21" rx="10.5" fill="#f1f5f9"/>
    <text x="853" y="227" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Build</text>
  </g>

  <!-- Stage 6 -->
  <g>
    <text x="1000" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Production</text>
    <text x="1000" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Safety</text>
    <circle cx="1000" cy="175" r="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
    <text x="1000" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">6</text>
    <rect x="968" y="212" width="64" height="21" rx="10.5" fill="#f1f5f9"/>
    <text x="1000" y="227" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">Secure</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="196" y="292" width="60" height="22" rx="11" fill="#dcfce7"/>
    <text x="226" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Assist</text>
    <text x="266" y="307" font-size="12" fill="#64748b">AI drafts, you act.</text>

    <rect x="430" y="292" width="54" height="22" rx="11" fill="#fef9c3"/>
    <text x="457" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207">Gate</text>
    <text x="494" y="307" font-size="12" fill="#64748b">Review or policy before production.</text>

    <rect x="760" y="292" width="54" height="22" rx="11" fill="#fee2e2"/>
    <text x="787" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Auto</text>
    <text x="824" y="307" font-size="12" fill="#64748b">Only after trust.</text>
  </g>
</svg>
