<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1180" viewBox="0 0 880 1180" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="880" height="1180" rx="16" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="440" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">AI for DevOps: A Practical Roadmap</text>
  <text x="440" y="80" text-anchor="middle" font-size="14" fill="#64748b">Start with Assist. Move to Gate as you build trust. Treat Auto as the exception.</text>

  <!-- spine -->
  <line x1="95" y1="150" x2="95" y2="926" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="95" y1="150" x2="95" y2="926" stroke="url(#spine)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- traveling pulse -->
  <circle r="8" fill="#6366f1" filter="url(#glow)">
    <animate attributeName="cx" values="95;95" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;926;150" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- stages -->
  <!-- helper pattern per stage: number node on spine, connector, card, badge -->

  <!-- Stage 0 -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="154" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="95" y="159" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">0</text>
    <line x1="110" y1="154" x2="140" y2="154" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="140" y="108" width="660" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="142" font-size="16" font-weight="700" fill="#0f172a">DevOps Foundations</text>
    <text x="164" y="166" font-size="12.5" fill="#64748b">The skills this builds on: Linux, Git, containers, Kubernetes, CI/CD, IaC, observability.</text>
    <rect x="686" y="124" width="98" height="22" rx="11" fill="#f1f5f9"/>
    <text x="735" y="139" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Prerequisite</text>
  </g>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="282" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="95" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">1</text>
    <line x1="110" y1="282" x2="140" y2="282" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="140" y="236" width="660" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="270" font-size="16" font-weight="700" fill="#0f172a">AI and LLM Foundations</text>
    <text x="164" y="294" font-size="12.5" fill="#64748b">Enough to use AI well: prompting, RAG, tool calling, agents, MCP, and the failure modes.</text>
    <rect x="712" y="252" width="72" height="22" rx="11" fill="#f1f5f9"/>
    <text x="748" y="267" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Learn</text>
  </g>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="410" r="15" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text x="95" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">2</text>
    <line x1="110" y1="410" x2="140" y2="410" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="140" y="364" width="660" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="398" font-size="16" font-weight="700" fill="#0f172a">AI-Assisted Daily Ops</text>
    <text x="164" y="422" font-size="12.5" fill="#64748b">Write IaC, policies, and docs. Explain logs and errors. You review everything.</text>
    <rect x="706" y="380" width="78" height="22" rx="11" fill="#dcfce7"/>
    <text x="745" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Assist</text>
  </g>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="538" r="15" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <text x="95" y="543" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">3</text>
    <line x1="110" y1="538" x2="140" y2="538" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="140" y="492" width="660" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="526" font-size="16" font-weight="700" fill="#0f172a">AI in CI/CD and GitOps</text>
    <text x="164" y="550" font-size="12.5" fill="#64748b">AI opens a pull request, policy checks run, a person merges. Its only tools are Git.</text>
    <rect x="712" y="508" width="72" height="22" rx="11" fill="#fef9c3"/>
    <text x="748" y="523" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207">Gate</text>
  </g>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="666" r="15" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <text x="95" y="671" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">4</text>
    <line x1="110" y1="666" x2="140" y2="666" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="140" y="620" width="660" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="654" font-size="16" font-weight="700" fill="#0f172a">AIOps and Incident Response</text>
    <text x="164" y="678" font-size="12.5" fill="#64748b">Triage alerts, suggest causes, draft postmortems. The on-call person stays in control.</text>
    <rect x="712" y="636" width="72" height="22" rx="11" fill="#fef9c3"/>
    <text x="748" y="651" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207">Gate</text>
  </g>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="794" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="95" y="799" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">5</text>
    <line x1="110" y1="794" x2="140" y2="794" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="140" y="748" width="660" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="782" font-size="16" font-weight="700" fill="#0f172a">Build Your Own AI Helpers</text>
    <text x="164" y="806" font-size="12.5" fill="#64748b">Agents, tools and MCP, RAG over your runbooks, guardrails, and testing your prompts.</text>
    <rect x="710" y="764" width="74" height="22" rx="11" fill="#f1f5f9"/>
    <text x="747" y="779" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Build</text>
  </g>

  <!-- Stage 6 -->
  <g filter="url(#shadow)">
    <circle cx="95" cy="922" r="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="95" y="927" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">6</text>
    <line x1="110" y1="922" x2="140" y2="922" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="140" y="876" width="660" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="910" font-size="16" font-weight="700" fill="#0f172a">Production, Safety and Governance</text>
    <text x="164" y="934" font-size="12.5" fill="#64748b">Least privilege, policy gating, audit trails, cost control, and knowing when not to use AI.</text>
    <rect x="708" y="892" width="76" height="22" rx="11" fill="#f1f5f9"/>
    <text x="746" y="907" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Secure</text>
  </g>

  <!-- Legend -->
  <g filter="url(#shadow)">
    <rect x="140" y="1004" width="660" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="164" y="1034" font-size="14" font-weight="700" fill="#0f172a">Trust levels</text>

    <rect x="164" y="1050" width="70" height="22" rx="11" fill="#dcfce7">
      <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="199" y="1065" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Assist</text>
    <text x="246" y="1065" font-size="12.5" fill="#64748b">AI drafts, a person does everything.</text>

    <rect x="164" y="1082" width="70" height="22" rx="11" fill="#fef9c3">
      <animate attributeName="opacity" values="1;0.55;1" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="199" y="1097" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207">Gate</text>
    <text x="246" y="1097" font-size="12.5" fill="#64748b">AI acts, but a review or policy check stands before production.</text>

    <rect x="620" y="1050" width="70" height="22" rx="11" fill="#fee2e2">
      <animate attributeName="opacity" values="1;0.55;1" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <text x="655" y="1065" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Auto</text>
    <text x="702" y="1065" font-size="12.5" fill="#64748b">Only after trust.</text>
  </g>
</svg>
